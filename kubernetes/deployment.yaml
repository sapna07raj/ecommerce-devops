apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ecommerce

  template:
    metadata:
      labels:
        app: ecommerce

    spec:
      containers:
        - name: ecommerce-container
          image: sapnarajbhar/ecommerce-app:1.0
          ports:
            - containerPort: 8000